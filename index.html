<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>मर्चेंट रजिस्ट्रेशन | Star Shop</title>
    <style>
        :root {
            --bg-color: #0b0b0f;
            --text-color: #f3f4f6;
            --card-bg: #16161a;
            --border-color: #27272a;
            --input-bg: #1f1f23;
            --input-text: #f3f4f6;
            --btn-bg: #f3f4f6;
            --btn-text: #0b0b0f;
            --accent-gray: #9ca3af;
            --badge-bg: #d4af37;
            --badge-text: #0b0b0f;
            --success-color: #10b981;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 440px;
        }

        .form-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 36px 28px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            position: relative;
        }

        .premium-badge {
            position: absolute;
            top: 0;
            right: 0;
            background-color: var(--badge-bg);
            color: var(--badge-text);
            font-size: 10px;
            font-weight: 800;
            letter-spacing: 1px;
            text-transform: uppercase;
            padding: 6px 16px;
            border-bottom-left-radius: 14px;
        }

        .form-header {
            text-align: center;
            margin-bottom: 24px;
        }

        .form-header h1 {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 6px;
        }

        .form-header p {
            font-size: 0.85rem;
            color: var(--accent-gray);
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 6px;
        }

        input[type="text"],
        input[type="tel"],
        textarea,
        select {
            width: 100%;
            padding: 12px 14px;
            background-color: var(--input-bg);
            border: 1px solid var(--border-color);
            color: var(--input-text);
            border-radius: 8px;
            font-size: 0.95rem;
            outline: none;
        }

        .photo-upload-container {
            border: 2px dashed var(--border-color);
            background-color: var(--input-bg);
            border-radius: 12px;
            padding: 16px;
            text-align: center;
            cursor: pointer;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .photo-upload-input {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer;
        }

        .upload-placeholder {
            display: flex; flex-direction: column; align-items: center; gap: 6px;
        }

        .photo-preview-box {
            display: none; width: 100%; align-items: center; gap: 12px;
        }

        .photo-preview-box img {
            width: 56px; height: 56px; border-radius: 8px; object-fit: cover; border: 1px solid var(--border-color);
        }

        .location-wrapper { display: flex; gap: 8px; }
        .location-btn {
            background-color: var(--border-color); color: var(--text-color); border: none; padding: 0 14px; border-radius: 8px; cursor: pointer; font-size: 0.8rem; font-weight: 600;
        }

        .submit-btn {
            width: 100%; padding: 13px; background-color: var(--btn-bg); color: var(--btn-text); border: none; border-radius: 8px; font-size: 0.95rem; font-weight: 600; cursor: pointer; margin-top: 8px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="form-card">
            <div class="premium-badge">VVIP PARTNER</div>

            <div class="form-header">
                <h1>मर्चेंट रजिस्ट्रेशन</h1>
                <p>Star Shop Partner Program</p>
            </div>

            <form id="merchantForm">
                <div class="form-group">
                    <label for="merchantId">मर्चेंट यूनिक आईडी (Store Username/ID)</label>
                    <input type="text" id="merchantId" placeholder="जैसे: aone_store या star123" required>
                </div>

                <div class="form-group">
                    <label for="name">दुकान का नाम (Store Name)</label>
                    <input type="text" id="name" placeholder="अपनी दुकान का नाम दर्ज करें" required>
                </div>

                <div class="form-group">
                    <label for="phone">फोन नंबर</label>
                    <input type="tel" id="phone" placeholder="10 अंकों का मोबाइल नंबर" pattern="[0-9]{10}" required>
                </div>

                <div class="form-group">
                    <label for="category">दुकान की कैटेगरी (Store Category)</label>
                    <input type="text" id="category" list="categoryList" placeholder="अपनी कैटेगरी चुनें..." required>
                    <datalist id="categoryList">
                        <option value="Kirana & Grocery">
                        <option value="Salon & Beauty">
                        <option value="Clothing & Fashion">
                        <option value="Cafe & Food">
                        <option value="Electronics">
                    </datalist>
                </div>

                <div class="form-group">
                    <label>दुकान की फोटो (Store Photo)</label>
                    <div class="photo-upload-container">
                        <input type="file" id="storeImageFile" class="photo-upload-input" accept="image/*" onchange="previewSelectedImage(event)">
                        <div class="upload-placeholder" id="uploadPlaceholder">
                            <span>📷 गैलरी से फोटो चुनें</span>
                        </div>
                        <div class="photo-preview-box" id="photoPreviewBox">
                            <img id="previewImg" src="">
                            <div id="fileNameText" style="font-size:0.85rem;"></div>
                        </div>
                    </div>
                </div>

                <div class="form-group">
                    <label for="address">व्यापार का एड्रेस</label>
                    <textarea id="address" placeholder="पूरा पता लिखें..." required></textarea>
                </div>

                <div class="form-group">
                    <label for="location">GPS लोकेशन</label>
                    <div class="location-wrapper">
                        <input type="text" id="location" placeholder="GPS लोकेशन..." required>
                        <button type="button" class="location-btn" onclick="getGPSLocation()">लोकेशन लें</button>
                    </div>
                </div>

                <button type="submit" class="submit-btn" id="submitBtn">दुकान लाइव करें 🚀</button>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL = 'https://gejrzpflcuvlbpedliwq.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_dw9J2AX0nd3SxPrRy9JGCg_YqS8ZfUF';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        function previewSelectedImage(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    document.getElementById('previewImg').src = e.target.result;
                    document.getElementById('fileNameText').textContent = file.name;
                    document.getElementById('uploadPlaceholder').style.display = 'none';
                    document.getElementById('photoPreviewBox').style.display = 'flex';
                }
                reader.readAsDataURL(file);
            }
        }

        function getGPSLocation() {
            const locationInput = document.getElementById('location');
            if (navigator.geolocation) {
                locationInput.value = "प्राप्त हो रही है...";
                navigator.geolocation.getCurrentPosition((pos) => {
                    locationInput.value = `${pos.coords.latitude.toFixed(6)}, ${pos.coords.longitude.toFixed(6)}`;
                }, () => { locationInput.value = ""; });
            }
        }

        document.getElementById('merchantForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const submitBtn = document.getElementById('submitBtn');
            submitBtn.textContent = "डेटा सेव हो रहा है...";
            submitBtn.disabled = true;

            const merchantId = document.getElementById('merchantId').value.trim();
            const name = document.getElementById('name').value.trim();
            const phone = document.getElementById('phone').value.trim();
            const category = document.getElementById('category').value.trim();
            const address = document.getElementById('address').value.trim();
            const location = document.getElementById('location').value.trim();
            const imageFileInput = document.getElementById('storeImageFile');

            let assignedImageUrl = "https://images.unsplash.com/photo-1555396273-367ea4eb4db5?w=600&auto=format&fit=crop&q=80";

            try {
                if (imageFileInput.files && imageFileInput.files[0]) {
                    const file = imageFileInput.files[0];
                    const filePath = `merchants/${merchantId}_${Date.now()}.${file.name.split('.').pop()}`;
                    await _supabase.storage.from('store-images').upload(filePath, file);
                    const { data: pubData } = _supabase.storage.from('store-images').getPublicUrl(filePath);
                    if (pubData) assignedImageUrl = pubData.publicUrl;
                }

                await _supabase.from('merchants').upsert([{
                    id: merchantId, phone, store_name: name, category, address, location, image_url: assignedImageUrl, status: 'approved'
                }]);

                alert('सफलता! अब WhatsApp पर भेजा जा रहा है...');
                window.location.href = `https://wa.me/919870242077?text=${encodeURIComponent(`नमस्ते, मैंने दुकान रजिस्टर कर दी है: ${name} (${merchantId})`)}`;
            } catch (err) {
                alert('एरर: ' + err.message);
                submitBtn.textContent = "दुकान लाइव करें 🚀";
                submitBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
